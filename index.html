<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TPTC Machine Consumables</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#17304a;font:16px system-ui}header{background:#12385c;color:white;padding:20px}main{max-width:1100px;margin:auto;padding:16px}h1{font-size:24px;margin:0}h2{font-size:19px}button,input,select{font:inherit;padding:12px;border-radius:8px;border:1px solid #b8c8d8}button{background:#19578a;color:white;cursor:pointer}button:disabled{opacity:.5}section,article{background:white;border-radius:12px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}.grid article{margin:0}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.low{color:#a65000}.out{color:#b02030}.ok{color:#16734a}small{display:block;color:#53677a}strong{font-size:24px}dialog{width:min(92vw,480px);border:0;border-radius:14px;padding:22px}dialog::backdrop{background:#0008}label{display:block;margin:12px 0}label input,label select{width:100%}#msg{white-space:pre-wrap} [hidden]{display:none!important}.machine{border:1px solid #cbd9e6;margin-bottom:18px}.machine .toolbar{justify-content:space-between}.machine h2{margin:0}.machine .grid{margin-top:12px}.machine article{background:#f5f8fb;border:1px solid #dce5ee}.subhead{margin:18px 0 8px;font-weight:700;color:#19578a}button{min-height:44px}dialog{max-height:90dvh;overflow:auto}nav{display:flex;gap:6px;overflow-x:auto;position:sticky;top:0;background:#eef3f8;padding:8px 0;z-index:3}nav button{white-space:nowrap;background:white;color:#17304a;border:1px solid #cbd9e6}nav button.active{background:#19578a;color:white}.machine .grid{display:block}.machine article{display:grid;grid-template-columns:minmax(120px,1fr) minmax(80px,auto) auto;gap:5px 12px;align-items:center;padding:10px;margin:5px 0}.machine article h2,.machine article p{margin:0;font-size:14px}.mac </style><header><h1>TPTC • Machine Consumables</h1><div id="status">Connecting…</div></header><main><p id="msg" role="status"></p><div id="app"><nav id="tabs" aria-label="Machine tabs"></nav><div id="workspace"><section><div class="toolbar"><button id="change">Edging Tool Change</button><button id="add">+ Add Stock Item</button><button id="refresh">Refresh</button></div><h2 id="summary"></h2><div class="toolbar"><input id="search" placeholder="Search consumables"><select id="filter"><option value="all">All stock</option><option value="low">Low / out of stock</option></select></div></section><div id="items"></div><details id="historypanel"><summary>Recent stock movements</summary><div id="history"></div></details></div></div></main><dialog id="tool"><form id="toolform"><h2>Tool Change</h2><label>Profile<select id="profile"><option>Full BN</option><option>SE</option></select></label><label>Opening<select id="opening"><option>2.2</option><option>3.2</option></select></label><label>Polish wheel<select id="polish" required><option value="">Select polish</option><option>Normal</option><option>Black</option></select></label><p>Deduct one Cutting Wheel, Cutting 40#, Grinding 60# and selected polish wheel.</p><button>Confirm tool change</button> <button type="button" onclick="document.getElementById('tool').close()">Cancel</button></form></dialog><dialog id="edit"><form id="editform"><h2 id="editname"></h2><label>Current stock count<input id="quantity" type="number" min="0" step="1" required></label><label>Minimum stock (blank = unset)<input id="minimum" type="number" min="0" step="1"></label><button>Save count</button> <button type="button" onclick="document.getElementById('edit').close()">Cancel</button></form></dialog><dialog id="adddialog"><form id="addform"><h2>Add Stock Item</h2><label>Machine<select id="newmachine"></select></label><label>Item name<input id="newname" required maxlength="150"></label><label>Specifications / size<input id="newdimensions" maxlength="200"></label><label>Current quantity<input id="newqty" type="number" min="0" step="1" value="0" required></label><label>Minimum stock<input id="newmin" type="number" min="0" step="1"></label><button>Add item</button> <button type="button" onclick="document.getElementById('adddialog').close()">Cancel</button></form></dialog><script>
const endpoint='https://kdyfkesxtcigzdkdnahe.supabase.co/rest/v1/rpc/';
const key='sb_publishable_ppP4lhySwGUob51ouYqVEQ_ot7_Ne29';
const db={async rpc(name,args){try{const r=await fetch(endpoint+name,{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify(args)});const raw=await r.text();let data;try{data=raw?JSON.parse(raw):null}catch{throw Error('Unexpected server response: '+r.status)}return r.ok?{data}:{error:{message:'HTTP '+r.status+': '+(data?.message||data?.error||raw||'Server error')}}}catch(e){return {error:{message:'Connection failed: '+e.message+'. Open in a full browser with internet access.'}}}}};
const storage={getItem(k){try{return window.localStorage.getItem(k)}catch{return null}},setItem(k,v){try{window.localStorage.setItem(k,v)}catch{}},removeItem(k){try{window.localStorage.removeItem(k)}catch{}}};
const $=id=>document.getElementById(id);let token=storage.getItem("tptc-pin-token"),rows=[],selected,busy=false;const msg=t=>$('msg').textContent=t;const check=r=>{if(r.error)throw Error(r.error.message);return r.data};const low=r=>r.qty===0||(r.minimum!==null&&r.qty<=r.minimum);const machines=['Edging','Gangsaw 1 & 2','4K Cutting','Mitre','Wash and Grind','Waterjet','Skimmer Lids','Wash and Chambering','Dropface Gluing','Gluing DFS','Misc'];for(const m of machines){const o=document.createElement('option');o.textContent=m;$('newmachine').append(o)}function openAdd(m){$('addform').reset();$('newmachine').value=m||'Edging';$('adddialog').showModal()}$('add').onclick=()=>openAdd(active);$('addform').onsubmit=e=>{e.preventDefault();run(e.currentTarget,async()=>{check(await db.rpc('pin_add_item',{p_token:token,p_machine:$('newmachine').value,p_item:$('newname').value,p_dimensions:$('newdimensions').value,p_qty:Number($('newqty').value),p_min:$('newmin').value===''?null:Number($('newmin').value)}));$('adddialog').close()})};let active='Overview';let connected=false;function tabs(){ $('tabs').replaceChildren(...['Overview',...machines].map(m=>{const b=document.createElement('button');b.textContent=m;b.className=m===active?'active':'';b.onclick=()=>{active=m;$('search').value='';$('filter').value='all';render()};return b}));}function render(){tabs();$('change').hidden=active!=='Edging';$('add').hidden=active==='Overview';$('historypanel').hidden=active!=='Overview'; $('summary').textContent=`${rows.length} items • ${rows.filter(r=>r.qty>0&&low(r)).length} low • ${rows.filter(r=>!r.qty).length} out of stock`; $('items').replaceChildren();if(active==='Overview'){const grid=document.createElement('div');grid.className='overview';for(const m of machines){const list=rows.filter(r=>r.machine===m);const b=document.createElement('button');const h=document.createElement('strong');h.textContent=m;const d=document.createElement('small');d.textContent=connected?`${list.length} items · ${list.filter(low).length} alerts`:'Awaiting cloud';b.append(h,d);b.onclick=()=>{active=m;render()};grid.append(b)}$('items').append(grid);const alerts=document.createElement('section');const fold=document.createElement('details');fold.open=window.stockAlertsOpen===true;fold.ontoggle=()=>{window.stockAlertsOpen=fold.open};const h=document.createElement('summary');h.style.cssText='cursor:pointer;font-weight:700;font-size:19px;padding:8px 0';h.textContent=`Stock alerts (${rows.filter(low).length})`;fold.append(h);alerts.append(fold);for(const r of rows.filter(low)){const b=document.createElement('button');b.style.cssText='display:block;width:100%;text-align:left;margin:5px 0;background:#fff;color:#a65000';b.textContent=`${r.machine} · ${r.profile==='Other'?'':r.profile+' '+r.opening+' · '}${r.item} — ${r.qty} left`;b.onclick=()=>{active=r.machine;render()};fold.append(b)}if(!rows.some(low))fold.append(connected?'No stock alerts':'Waiting for cloud data');$('items').append(alerts);return}const groups=new Map();for(const m of [active]){const sec=document.createElement('section');sec.className='machine';const bar=document.createElement('div');bar.className='toolbar';const h=document.createElement('h2');h.textContent=m;const b=document.createElement('button');b.textContent='+ Add Stock Item';b.onclick=()=>openAdd(m);bar.append(h,b);sec.append(bar);$('items').append(sec);groups.set(m,sec)}const grids=new Map();for(const r of rows.filter(r=>r.machine===active&&( $('filter').value==='all'||low(r))&&Object.values(r).join(' ').toLowerCase().includes($('search').value.toLowerCase()))){const a=document.createElement('article');const title=document.createElement('h2');title.textContent=r.profile==='Other'?r.item:r.profile+' '+(r.opening==='—'?'':r.opening+' cm');const name=document.createElement('p');name.textContent=r.item;const detail=document.createElement('small');detail.textContent=r.dimensions;const count=document.createElement('strong');count.textContent=r.qty+' in stock';count.className=!r.qty?'out':low(r)?'low':'ok';const min=document.createElement('p');min.textContent='Minimum: '+(r.minimum??'Not set')+' • '+(!r.qty?'Out of stock':low(r)?'Low stock':'In stock');const b=document.createElement('button');b.textContent='Update stock / minimum';b.onclick=()=>{selected=r;$('editname').textContent=r.profile+' '+r.opening+' '+r.item;$('quantity').value=r.qty;$('minimum').value=r.minimum??'';$('edit').showModal()};a.append(title);if(r.profile!=='Other')a.append(name);a.append(detail,count,min,b);const minus=document.createElement('button');minus.className='minus';minus.textContent='−';minus.title='Deduct one from stock';minus.setAttribute('aria-label','Deduct one '+r.item);minus.disabled=r.qty<=0||busy||!connected;minus.onclick=async()=>{if(busy||r.qty<=0)return;busy=true;minus.disabled=true;try{check(await db.rpc('pin_stock',{p_token:token,p_id:r.id,p_old:r.qty,p_qty:r.qty-1,p_min:r.minimum}));msg('One removed from '+r.item);await load()}catch(e){msg(e.message);await load()}finally{busy=false;render()}};const outer=document.createElement("div");outer.className="stockrow";outer.append(a,minus);const machine=r.machine||'Misc';const sub=machine==='Edging'&&r.profile!=='Other'?r.profile+' — '+r.opening+' cm':'Stock items';const k=machine+'|'+sub;if(!grids.has(k)){const sec=groups.get(machine);if(!sec)continue;const heading=document.createElement('div');heading.className='subhead';heading.textContent=sub;const grid=document.createElement('div');grid.className='grid';sec.append(heading,grid);grids.set(k,grid)}grids.get(k).append(outer)}}async function load(){try{rows=check(await db.rpc('pin_inventory',{p_token:token}));if(!rows.length)throw Error('Staff access not assigned. Ask your administrator.');connected=true;render();const h=check(await db.rpc('pin_history',{p_token:token}));$('history').replaceChildren(...h.map(m=>{const p=document.createElement('p');p.textContent=new Date(m.created_at).toLocaleString()+' • '+m.action+' • '+(rows.find(r=>r.id===m.item_id)?.item??m.item_id)+' • '+m.delta;return p}));$('status').textContent='Cloud connected • '+new Date().toLocaleTimeString()}catch(e){$('status').textContent='Not synced';msg(e.message);if(e.message.includes('PIN session expired')){token=null;storage.removeItem('tptc-pin-token')}}}async function session(){try{if(!token){const result=check(await db.rpc('pin_login',{p_pin:'1234'}));if(!result?.token)throw Error(result?.error||'No session');token=result.token;storage.setItem('tptc-pin-token',token)}await load()}catch(e){$('status').textContent='Not synced';msg(e.message)}}async function run(form,fn){if(busy)return;busy=true;const b=form.querySelector('button');b.disabled=true;try{await fn();msg('Saved to cloud');await load()}catch(e){msg(e.message);alert(e.message)}finally{busy=false;b.disabled=false}}$('refresh').onclick=session;$('search').oninput=render;$('filter').onchange=render;$('change').onclick=()=>{$('polish').value='';$('tool').showModal()};$('toolform').onsubmit=e=>{e.preventDefault();run(e.currentTarget,async()=>{check(await db.rpc('pin_change',{p_token:token,p_profile:$('profile').value,p_opening:$('opening').value,p_polish:$('polish').value}));$('tool').close()})};$('editform').onsubmit=e=>{e.preventDefault();run(e.currentTarget,async()=>{check(await db.rpc('pin_stock',{p_token:token,p_id:selected.id,p_old:selected.qty,p_qty:Number($('quantity').value),p_min:$('minimum').value===''?null:Number($('minimum').value)}));$('edit').close()})};render();session();setInterval(()=>{if(!busy&&token)load()},3000);</script></html>
